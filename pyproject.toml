[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "line-redshift"
version = "0.1.0"
description = "Spectral-line pair redshift hypotheses, legacy lines.freq ladders and local notifications"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]
license = {text = "MIT"}

[project.scripts]
line-redshift = "line_redshift.cli:main"

[tool.setuptools.packages.find]
include = ["line_redshift*"]
